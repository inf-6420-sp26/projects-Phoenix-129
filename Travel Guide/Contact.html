<main class="form">
<h1>Have any questions or concerns? Fill out the following.</h1>

<form>
  <div>
    <label for="full-name">Full Name</label>
    <input type="text" id="full-name" name="user_name" required>
  </div>

  <div>
    <label for="email">Email Address</label>
    <input type="email" id="email" name="user_email" required>
  </div>
 <br>
  <div>
    <label for="phone">Phone Number (Optional)</label>
    <input type="tel" id="phone" name="user_phone">
  </div>
  <fieldset>
    <legend>Which of the following is your message about (Select all that apply)</legend>
    <div class="checkbox-group">
      <div>
        <input type="checkbox" id="gen" name="message" value="Comment">
        <label for="js">General Comment/Feedback</label>
      </div>
      <div>
        <input type="checkbox" id="que" name="message" value="questions">
        <label for="html">Question</label>
      </div>
      <div>
        <input type="checkbox" id="con" name="message" value="concern">
        <label for="python">Concerns</label>
      </div>
    </div>
  </fieldset>
  <div >
    <label for="Comments">Comments,Questions Or Concerns</label>
    <textarea id="Comments" name="user_comments" placeholder="Any questions, comments, or concerns you have about traveling here."></textarea>
  </div>
  <div>
    <button type="submit">Submit Application</button>
  </div>
</form>
</main>
